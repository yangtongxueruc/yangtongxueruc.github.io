<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>这个地址没有内容</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         background: #0b0d10; color: #f2f4f6;
         font: 400 16px/1.7 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .box { text-align: center; padding: 32px; max-width: 520px; }
  .mark { width: 56px; height: 56px; margin: 0 auto 28px; display: grid; place-items: center;
          border: 1px solid rgba(10,186,181,.5); border-radius: 14px;
          font-size: 26px; color: #0abab5; }
  h1 { font-size: 26px; font-weight: 600; margin: 0 0 12px; letter-spacing: -.02em; }
  p { margin: 0 0 32px; color: #9aa2ab; font-size: 14px; }
  a { display: inline-block; padding: 10px 22px; border: 1px solid rgba(10,186,181,.55);
      border-radius: 999px; color: #0abab5; text-decoration: none; font-size: 14px; }
  a:hover { background: rgba(10,186,181,.1); }
</style>
</head>
<body>
  <div class="box">
    <div class="mark" aria-hidden="true">🐑</div>
    <h1>这个地址没有内容</h1>
    <p>404，你发现了宇宙的新页面。</p>
    <!-- Pages 返回本页时地址仍是用户请求的深层 URL，相对路径会指错，
         所以这里用构建时确定的站点前缀写绝对地址，且不加载任何外部资源。 -->
    <a href="/index.html">回到首页 →</a>
  </div>
</body>
</html>
