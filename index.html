<!-- 托管方（GitHub Pages）不能加 HTTP 头，只能用 meta 版的 CSP。
     目标是挡住「页面被注入一段外链脚本」这条最危险的路：script-src 只允许
     同源，外站脚本即使被塞进 DOM 也加载不了。
     必须保留 'unsafe-inline' —— 页头那段主题预置脚本是内联的，属性里也有
     内联 style；换成 hash 会把维护成本抬得比收益高。
     img-src 要带 data:，人像是内嵌的 data URI。 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">

        : m;
      document.documentElement.setAttribute("data-theme", r);

</script>

<!-- 首屏人像：乱线团替代层（仅桌面宽屏）。手机 / 平板不注入脚本，
     下面这些规则也全都匹配不上，等于不存在。
     data-pfx 由 portrait-fx.js 画出首帧后才置位；脚本没跑起来就一直是空的，
     照片照常显示 —— 所以这里只「让位」，不做任何不可逆的隐藏。 -->
<style>
  /* 这句手写字（原图底部本来就有）默认永远不显示，写在媒体查询外面是有意的：
     .portrait 是 flex 容器，span 子项会被块化成 block，只靠「媒体查询不匹配」
     兜不住 —— 它照样会占位、照样能被看见。手机 / 平板看的是原照片，那句话
     本来就印在照片上，再叠一层就是重影。下面媒体查询里只有 canvas 真正生效
     （data-pfx 置位）时，才把它放出来。 */
  .portrait > .portrait__signature { display: none; }

  @media (min-width: 941px) and (hover: hover) and (pointer: fine) {
    html[data-pfx] .portrait > img { opacity: 0 !important; }
    .portrait > canvas.pfx {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 2;
      pointer-events: none;
      opacity: 0;
      transition: opacity 700ms cubic-bezier(.22, 1, .36, 1);
    }
    /* 0.74 对齐原照片在 dim 模式下的 opacity: .58 —— 亮度压在同一档，
       密集处靠 canvas 内部叠加变实，稀疏处自然淡下去 */
    html[data-pfx="on"] .portrait > canvas.pfx { opacity: .74; }

    /* 文字本体 + 一圈同色系的柔光衬底：线条会从字缝里穿过去，
       没有这层衬底时字读起来发花。深色底用暗晕、浅色底用亮晕。*/
    html[data-pfx] body {
      --pfx-sign: #eef2f8;
      --pfx-sign-halo: rgba(5, 7, 7, .92);
    }
    html[data-pfx][data-theme="light"] body,
    html[data-pfx] body[data-fx="paper"] {
      --pfx-sign: #1a1d22;
      --pfx-sign-halo: rgba(255, 255, 255, .92);
    }
    html[data-pfx] .portrait > .portrait__signature {
      display: block;
      position: absolute;
      left: 0;
      right: 0;
      bottom: 8.6%;
      z-index: 4;
      text-align: center;
      font-family: Georgia, "Times New Roman", "Songti SC", "SimSun", serif;
      font-size: clamp(17px, 1.55vw, 23px);
      line-height: 1;
      letter-spacing: 0.012em;
      color: var(--pfx-sign);
      /* 柔光衬底收得很紧（2px / 6px 两层）：再大就糊成一团暗斑了。
         线团是流动的，字压在它上面必须有自己的一点点底，否则笔画穿字时读不出字。*/
      text-shadow: 0 0 2px var(--pfx-sign-halo), 0 0 6px var(--pfx-sign-halo);
      opacity: 0;
      transition: opacity 700ms cubic-bezier(.22, 1, .36, 1) 220ms;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }
    html[data-pfx="on"] .portrait > .portrait__signature { opacity: .9; }
  }
</style>
<script>
  /* 人像替代层的加载引导：宽屏 + 有精确指针（鼠标）才注入。
     触屏设备、窄屏、以及 ?pfx=0 都不会产生这一次请求。 */
  (function () {
    try {
      if (new URLSearchParams(location.search).get("pfx") === "0") return;
      var html = document.documentElement;
      var MQ = "(min-width: 941px) and (hover: hover) and (pointer: fine)";

      function inject() {
        /* boot：照片先让位，避免「先看到照片、再突然变成线团」的闪烁。
           脚本加载失败立即回滚，2.5s 没画出首帧也回滚。 */
        if (html.getAttribute("data-pfx")) return;
        html.setAttribute("data-pfx", "boot");
        var s = document.createElement("script");
        s.src = "assets/js/portrait-fx.js?v=127";
        s.async = true;
        s.onerror = function () { html.removeAttribute("data-pfx"); };
        document.head.appendChild(s);
        setTimeout(function () {
          if (html.getAttribute("data-pfx") === "boot") html.removeAttribute("data-pfx");
        }, 2500);
      }

      var mq = window.matchMedia(MQ);
      if (mq.matches) { inject(); return; }

      /* 首帧不匹配时不能就此放弃：内容控制台的预览是个 iframe，它以
         默认 300px 宽加载，之后才被撑到 1440px —— 那时再看是真的宽屏了。
         视口一变匹配就补上，否则控制台里永远看不到线团。
         手机 / 平板无论怎么转屏都不会匹配（pointer:fine 那一项过不去）。*/
      var onChange = function (e) {
        if (!e.matches) return;
        mq.removeEventListener("change", onChange);
        inject();
      };
      if (mq.addEventListener) mq.addEventListener("change", onChange);
    } catch (e) {}
  })();
</script>
