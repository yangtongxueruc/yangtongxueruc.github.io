<meta name="theme-color" content="#000000">
<meta name="referrer" content="strict-origin-when-cross-origin">
<!-- 托管方（GitHub Pages）不能加 HTTP 头，只能用 meta 版的 CSP。
     目标是挡住「页面被注入一段外链脚本」这条最危险的路：script-src 只允许
     同源，外站脚本即使被塞进 DOM 也加载不了。
     必须保留 'unsafe-inline' —— 页头那段主题预置脚本是内联的，属性里也有
     内联 style；换成 hash 会把维护成本抬得比收益高。
     img-src 要带 data:，人像是内嵌的 data URI。 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta property="og:type" content="website">
<meta property="og:title" content="Zhijie Yang | Campus Recruiter">
<meta property="og:description" content="宣讲会、办公室、白板与深夜的城市。一些和校招有关的碎片。">

<script>
  document.documentElement.classList.add("js");
  (function () {
    try {
      var m = localStorage.getItem("v2:theme") || "dark";
      var r = m === "system"
        ? (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
        : m;
      document.documentElement.setAttribute("data-theme", r);
    } catch (e) {}
  })();
</script>
